pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // ForgeGradle 6.0.54 adds its verified BUNDELED repository while the
    // plugin is applied. PREFER_PROJECT permits that required repository;
    // dependency versions remain exact in gradle.properties and verification
    // metadata is still mandatory in CI.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven {
            url = 'https://libraries.minecraft.net'
            metadataSources {
                artifact()
            }
            content {
                includeGroup('com.mojang')
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'reality-foundation'
include ':reality-foundation-api'
project(':reality-foundation-api').projectDir = file('foundation-api')
include 'forge-1.20.1'

// The public build checks out the reviewed reality-core repository next to
// this repository. A Maven fallback is deliberately not provided: a build
// without the reviewed core ref must fail rather than silently resolving a
// different snapshot.
def corePath = providers.gradleProperty('realityCoreDir').orElse('../reality-core').get()
def coreDir = file(corePath)
if (!coreDir.isDirectory()) {
    throw new GradleException("Reviewed reality-core checkout is required at ${coreDir}")
}
gradle.ext.realityCoreDir = coreDir
includeBuild(coreDir) {
    dependencySubstitution {
        substitute module('io.github.yu1sh.reality:reality-core') using project(':')
    }
}
